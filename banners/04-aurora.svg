<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
<style>
.t{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#FFFFFF}
.s{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#B8A1D9;letter-spacing:.5px}
.a{animation:a 14s ease-in-out infinite alternate}.b{animation:b 17s ease-in-out infinite alternate}.c{animation:a 20s ease-in-out infinite alternate-reverse}@keyframes a{to{transform:translate(160px,-30px)}}@keyframes b{to{transform:translate(-180px,40px)}}
</style>
<defs><clipPath id="c"><rect width="900" height="200" rx="14"/></clipPath><filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter></defs>
<g clip-path="url(#c)">
<rect width="900" height="200" fill="#2E2440"/>
<g filter="url(#b)"><circle class="a" cx="250" cy="120" r="110" fill="#B8A1D9" opacity=".55"/><circle class="b" cx="650" cy="80" r="100" fill="#E8B4D0" opacity=".45"/><circle class="c" cx="470" cy="190" r="80" fill="#F28C28" opacity=".25"/></g>
</g>
<text class="t" x="50%" y="96" text-anchor="middle">Mislav Dobrinić</text>
<text class="s" x="50%" y="130" text-anchor="middle">Software Engineer · Zagreb</text>
</svg>