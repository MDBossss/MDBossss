<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
<style>
.t{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#FFFFFF}
.s{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#B8A1D9;letter-spacing:.5px}
.g{animation:g 5s ease-in-out infinite alternate;opacity:.15}@keyframes g{to{opacity:.45}}
</style>
<defs><clipPath id="c"><rect width="900" height="200" rx="14"/></clipPath><filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter></defs>
<g clip-path="url(#c)">
<rect width="900" height="200" fill="#2E2440"/>
<ellipse class="g" cx="450" cy="200" rx="320" ry="90" fill="#F28C28" filter="url(#b)"/>
</g>
<text class="t" x="50%" y="96" text-anchor="middle">Mislav Dobrinić</text>
<text class="s" x="50%" y="130" text-anchor="middle">Software Engineer · Zagreb</text>
</svg>