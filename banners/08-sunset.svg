<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200">
<style>
.t{font:700 44px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#FFFFFF}
.s{font:500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;fill:#B8A1D9;letter-spacing:.5px}
.u{animation:u 10s ease-in-out infinite alternate}@keyframes u{to{transform:translateY(25px)}}
</style>
<defs><clipPath id="c"><rect width="900" height="200" rx="14"/></clipPath><linearGradient id="sky" y2="1" x2="0"><stop offset="0" stop-color="#2E2440"/><stop offset="1" stop-color="#5B4A80"/></linearGradient><linearGradient id="sun" y2="1" x2="0"><stop offset="0" stop-color="#E8B4D0"/><stop offset="1" stop-color="#F28C28"/></linearGradient></defs>
<g clip-path="url(#c)">
<rect width="900" height="200" fill="#2E2440"/>
<rect width="900" height="200" fill="url(#sky)"/><circle class="u" cx="760" cy="168" r="52" fill="url(#sun)"/><rect y="150" width="900" height="2" fill="#2E2440"/><rect y="162" width="900" height="3" fill="#2E2440"/><rect y="174" width="900" height="4" fill="#2E2440"/><rect y="186" width="900" height="5" fill="#2E2440"/><rect y="198" width="900" height="6" fill="#2E2440"/>
</g>
<text class="t" x="50%" y="96" text-anchor="middle">Mislav Dobrinić</text>
<text class="s" x="50%" y="130" text-anchor="middle">Software Engineer · Zagreb</text>
</svg>